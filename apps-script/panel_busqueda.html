<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial;
        padding: 16px;
        font-size: 13px;
      }
      h2 {
        color: #1a73e8;
        font-size: 18px;
        margin-bottom: 12px;
      }
      .tabs {
        display: flex;
        margin-bottom: 12px;
        border-bottom: 1px solid #ccc;
      }
      .tab {
        flex: 1;
        text-align: center;
        padding: 8px 4px;
        cursor: pointer;
        color: #555;
        border-bottom: 2px solid transparent;
        font-size: 12px;
      }
      .tab.active {
        color: #1a73e8;
        border-bottom: 2px solid #1a73e8;
        font-weight: bold;
      }
      .panel { display: none; }
      .panel.active { display: block; }
      input {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        background-color: #1a73e8;
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }
      button:hover { background-color: #0c5bd8; }
      button:disabled { background-color: #a9c7f5; cursor: default; }
      button.secondary {
        background-color: #f1f3f4;
        color: #1a73e8;
        margin-top: 6px;
      }
      #status, #statusFoto { margin: 10px 0; color: #555; }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th, td {
        text-align: left;
        padding: 6px 4px;
        border-bottom: 1px solid #eee;
        font-size: 12px;
      }
      th { background-color: #f8f9fa; position: sticky; top: 0; }
      tr.clickable { cursor: pointer; }
      tr.clickable:hover { background-color: #f1f7ff; }
      .badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: bold;
      }
      .badge.si { background-color: #e6f4ea; color: #137333; }
      .badge.no { background-color: #fce8e6; color: #a50e0e; }
      .modelo-titulo, .seccion-titulo {
        margin-top: 14px;
        font-weight: bold;
        color: #333;
      }
      .seccion-titulo { color: #1a73e8; font-size: 13px; }
      #preview {
        max-width: 100%;
        max-height: 160px;
        margin: 8px 0;
        border-radius: 4px;
        display: none;
      }
      #textoExtraido {
        background: #f8f9fa;
        border: 1px solid #eee;
        border-radius: 4px;
        padding: 8px;
        font-size: 11px;
        white-space: pre-wrap;
        max-height: 100px;
        overflow-y: auto;
        margin-top: 8px;
        display: none;
      }
      .nota {
        font-size: 11px;
        color: #777;
        margin-top: 4px;
      }
    </style>
  </head>

  <body>
    <h2>Buscar Repuesto – Tecnocool</h2>

    <div class="tabs">
      <div class="tab active" id="tabModelo" onclick="switchTab('modelo')">Por Modelo</div>
      <div class="tab" id="tabParte" onclick="switchTab('parte')">Por Parte</div>
      <div class="tab" id="tabFoto" onclick="switchTab('foto')">Por Foto</div>
    </div>

    <!-- Panel: Modelo / Parte (texto) -->
    <div class="panel active" id="panelTexto">
      <input id="searchInput" placeholder="Ej: VEXD007N432U">
      <button onclick="doSearch()">Buscar</button>
      <button class="secondary" id="backBtn" style="display:none" onclick="backToModels()">‹ Volver a modelos</button>
      <div id="status"></div>
      <div id="results"></div>
    </div>

    <!-- Panel: Foto (OCR) -->
    <div class="panel" id="panelFoto">
      <input type="file" id="fotoInput" accept="image/*" capture="environment" onchange="previewFoto()">
      <div class="nota">Sirve tanto para la placa de un equipo (te da el despiece) como para la caja/etiqueta de un repuesto suelto (te dice a qué modelos pertenece).</div>
      <img id="preview">
      <button id="buscarFotoBtn" onclick="doSearchByPhoto()" disabled>Buscar por foto</button>
      <div id="statusFoto"></div>
      <div id="textoExtraido"></div>
      <div id="resultsFoto"></div>
    </div>

    <script>
      let mode = 'modelo'; // 'modelo' | 'parte'
      let lastModelResults = [];
      let lastPartResultsFoto = [];
      let fotoBase64 = null;
      let fotoMimeType = null;

      function switchTab(newTab) {
        document.getElementById('tabModelo').classList.toggle('active', newTab === 'modelo');
        document.getElementById('tabParte').classList.toggle('active', newTab === 'parte');
        document.getElementById('tabFoto').classList.toggle('active', newTab === 'foto');

        document.getElementById('panelTexto').classList.toggle('active', newTab !== 'foto');
        document.getElementById('panelFoto').classList.toggle('active', newTab === 'foto');

        if (newTab !== 'foto') {
          mode = newTab;
          document.getElementById('searchInput').placeholder =
            mode === 'modelo' ? 'Ej: VEXD007N432U' : 'Ej: 07415200002 o nombre de la pieza';
          document.getElementById('results').innerHTML = '';
          document.getElementById('status').innerHTML = '';
          document.getElementById('backBtn').style.display = 'none';
        }
      }

      function setStatus(msg) { document.getElementById('status').innerText = msg; }
      function setStatusFoto(msg) { document.getElementById('statusFoto').innerText = msg; }

      function stockBadge(row) {
        if (row.en_catalogo_tecnocool) {
          return '<span class="badge si">Stock: ' + row.stock + '</span>';
        }
        return '<span class="badge no">Sin registrar</span>';
      }

      /* ---------- Búsqueda por texto (Modelo / Parte) ---------- */

      function doSearch() {
        const q = document.getElementById('searchInput').value.trim();
        if (!q) { setStatus('Escribe algo para buscar.'); return; }

        document.getElementById('results').innerHTML = '';
        document.getElementById('backBtn').style.display = 'none';
        setStatus('Buscando... (puede tardar unos segundos, el catálogo tiene más de 51,000 líneas)');

        if (mode === 'modelo') {
          google.script.run.withSuccessHandler(renderModelResults).withFailureHandler(showError).searchEquipmentModels(q);
        } else {
          google.script.run.withSuccessHandler(renderPartResults).withFailureHandler(showError).searchParts(q);
        }
      }

      function showError(err) { setStatus('✖ ' + (err.message || err)); }
      function showErrorFoto(err) { setStatusFoto('✖ ' + (err.message || err)); }

      function renderModelResults(models) {
        lastModelResults = models;
        if (!models.length) { setStatus('No se encontraron modelos que coincidan.'); return; }
        setStatus(models.length + ' modelo(s) encontrado(s). Haz clic en uno para ver su despiece.');

        let html = '<table><tr><th>Modelo</th><th>Línea</th><th>Descripción</th></tr>';
        models.forEach(function (m, idx) {
          html += '<tr class="clickable" onclick="showModelParts(' + idx + ')">' +
            '<td>' + m.model_code + '</td><td>' + m.line + '</td><td>' + m.range_description + '</td></tr>';
        });
        html += '</table>';
        document.getElementById('results').innerHTML = html;
      }

      function showModelParts(idx) {
        const model = lastModelResults[idx];
        setStatus('Cargando despiece de ' + model.model_code + '...');
        document.getElementById('backBtn').style.display = 'block';

        google.script.run
          .withSuccessHandler(function (parts) { renderPartsOfModel(parts, model); })
          .withFailureHandler(showError)
          .getPartsForModel(model.model_id);
      }

      function renderPartsOfModel(parts, model) {
        if (!parts.length) {
          setStatus('Ese modelo no tiene repuestos registrados en el catálogo.');
          document.getElementById('results').innerHTML = '';
          return;
        }
        setStatus(parts.length + ' repuesto(s) para ' + model.model_code);

        let html = '<div class="modelo-titulo">' + model.model_code + ' — ' + model.range_description + '</div>';
        html += '<table><tr><th>Pos.</th><th>Parte</th><th>Nombre</th><th>Cant.</th><th>Existencia</th></tr>';
        parts.forEach(function (p) {
          html += '<tr>' +
            '<td>' + (p.exploded_view_no || '') + '</td>' +
            '<td>' + p.part_code + '</td>' +
            '<td>' + p.part_name + '</td>' +
            '<td>' + p.qty + '</td>' +
            '<td>' + stockBadge(p) + '</td></tr>';
        });
        html += '</table>';
        document.getElementById('results').innerHTML = html;
      }

      function backToModels() {
        renderModelResults(lastModelResults);
        document.getElementById('backBtn').style.display = 'none';
      }

      function renderPartResults(parts) {
        if (!parts.length) { setStatus('No se encontraron repuestos que coincidan.'); return; }
        setStatus(parts.length + ' repuesto(s) encontrado(s).');

        let html = '<table><tr><th>Parte</th><th>Nombre</th><th>Existencia</th></tr>';
        parts.forEach(function (p) {
          html += '<tr><td>' + p.part_code + '</td><td>' + p.part_name + '</td><td>' + stockBadge(p) + '</td></tr>';
        });
        html += '</table>';
        document.getElementById('results').innerHTML = html;
      }

      /* ---------- Búsqueda por foto (OCR) ---------- */

      function previewFoto() {
        const file = document.getElementById('fotoInput').files[0];
        if (!file) return;

        fotoMimeType = file.type;
        const reader = new FileReader();
        reader.onload = function (e) {
          const dataUrl = e.target.result;
          fotoBase64 = dataUrl.split(',')[1];

          const preview = document.getElementById('preview');
          preview.src = dataUrl;
          preview.style.display = 'block';

          document.getElementById('buscarFotoBtn').disabled = false;
          setStatusFoto('Foto lista. Presiona "Buscar por foto".');
        };
        reader.readAsDataURL(file);
      }

      function doSearchByPhoto() {
        if (!fotoBase64) { setStatusFoto('Primero toma o selecciona una foto.'); return; }

        document.getElementById('resultsFoto').innerHTML = '';
        document.getElementById('textoExtraido').style.display = 'none';
        document.getElementById('buscarFotoBtn').disabled = true;
        setStatusFoto('Leyendo la foto (OCR)... puede tardar unos segundos.');

        google.script.run
          .withSuccessHandler(renderPhotoResult)
          .withFailureHandler(function (err) {
            document.getElementById('buscarFotoBtn').disabled = false;
            showErrorFoto(err);
          })
          .searchByPhoto(fotoBase64, fotoMimeType, 'foto.jpg');
      }

      function renderPhotoResult(result) {
        document.getElementById('buscarFotoBtn').disabled = false;

        const textoDiv = document.getElementById('textoExtraido');
        textoDiv.style.display = 'block';
        textoDiv.innerText = 'Texto detectado:\n' + (result.texto_extraido || '(sin texto legible)');

        const tieneModelos = result.modelos_encontrados && result.modelos_encontrados.length;
        const tienePartes = result.partes_encontradas && result.partes_encontradas.length;

        if (!tieneModelos && !tienePartes) {
          setStatusFoto('No se reconoció ningún modelo ni número de parte del catálogo. Copia el texto detectado y búscalo manualmente en "Por Modelo" o "Por Parte".');
          document.getElementById('resultsFoto').innerHTML = '';
          return;
        }

        setStatusFoto('Coincidencias encontradas:');
        let html = '';

        if (tieneModelos) {
          lastModelResults = result.modelos_encontrados;
          html += '<div class="seccion-titulo">Modelo(s) de equipo reconocido(s)</div>';
          html += '<table><tr><th>Modelo</th><th>Línea</th><th>Descripción</th></tr>';
          result.modelos_encontrados.forEach(function (m, idx) {
            html += '<tr class="clickable" onclick="showModelPartsFromFoto(' + idx + ')">' +
              '<td>' + m.model_code + '</td><td>' + m.line + '</td><td>' + m.range_description + '</td></tr>';
          });
          html += '</table>';
        }

        if (tienePartes) {
          lastPartResultsFoto = result.partes_encontradas;
          html += '<div class="seccion-titulo">Repuesto(s) reconocido(s) — clic para ver a qué modelos pertenece</div>';
          html += '<table><tr><th>Parte</th><th>Nombre</th><th>Existencia</th></tr>';
          result.partes_encontradas.forEach(function (p, idx) {
            html += '<tr class="clickable" onclick="showModelsForPartFromFoto(' + idx + ')">' +
              '<td>' + p.part_code + '</td><td>' + p.part_name + '</td><td>' + stockBadge(p) + '</td></tr>';
          });
          html += '</table>';
        }

        html += '<div id="detalleFoto"></div>';
        document.getElementById('resultsFoto').innerHTML = html;
      }

      function showModelPartsFromFoto(idx) {
        const model = lastModelResults[idx];
        setStatusFoto('Cargando despiece de ' + model.model_code + '...');

        google.script.run
          .withSuccessHandler(function (parts) {
            switchTab('modelo');
            renderPartsOfModel(parts, model);
            document.getElementById('backBtn').style.display = 'none';
          })
          .withFailureHandler(showErrorFoto)
          .getPartsForModel(model.model_id);
      }

      function showModelsForPartFromFoto(idx) {
        const part = lastPartResultsFoto[idx];
        const detalle = document.getElementById('detalleFoto');
        detalle.innerHTML = 'Buscando modelos que usan ' + part.part_code + '...';

        google.script.run
          .withSuccessHandler(function (res) { renderModelsForPart(res, part); })
          .withFailureHandler(showErrorFoto)
          .getModelsForPart(part.part_id);
      }

      function renderModelsForPart(res, part) {
        const detalle = document.getElementById('detalleFoto');
        if (!res.modelos.length) {
          detalle.innerHTML = 'No se encontró en qué modelos se usa ' + part.part_code + '.';
          return;
        }

        let html = '<div class="modelo-titulo">' + part.part_code + ' — ' + part.part_name + '</div>';
        if (res.total > res.modelos.length) {
          html += '<div class="nota">Se usa en ' + res.total + ' modelos; mostrando los primeros ' + res.modelos.length + '.</div>';
        } else {
          html += '<div class="nota">Se usa en ' + res.total + ' modelo(s).</div>';
        }
        html += '<table><tr><th>Modelo</th><th>Línea</th><th>Descripción</th></tr>';
        res.modelos.forEach(function (m) {
          html += '<tr><td>' + m.model_code + '</td><td>' + m.line + '</td><td>' + m.range_description + '</td></tr>';
        });
        html += '</table>';
        detalle.innerHTML = html;
      }
    </script>
  </body>
</html>
